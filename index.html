<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser tab icon. Sized-down copies of src/assets/logo.png — the
         2048px original is 3.25 MB and would be downloaded for a 32px tab. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Anek+Telugu:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Sri Shakthi Ganapathi Committee — Vinayaka Chavithi, Rajamahendravaram</title>

    <!-- No "listen to this page" button on the committee's site.
         Google's text-to-speech services offer to read a page aloud, and on a
         page that is half Telugu and half English — with an English voice
         reading Telugu names — the result is not something the committee wants
         attached to their site. This is Google's documented opt-out; a
         read-aloud a visitor switches on inside their own browser is theirs to
         switch on, and no page can or should override that. -->
    <meta name="google" content="nopagereadaloud" />

    <!-- Search results and, mostly, the WhatsApp preview. The site is a single
         page rendered in the browser, so a crawler sees only this file: nothing
         written here comes from the sheets, and none of it changes with the
         language toggle. Keep it to what is true of the site as a whole.

         og:image is generated by scripts/make-og-image.js — re-run that after
         changing the emblem or the wording rather than editing the PNG. The same
         card is kept as scripts/og-card.html for capturing by hand. It must stay
         under ~600 KB or WhatsApp silently shows no preview at all. -->
    <meta name="description" content="The Sri Shakthi Ganapathi Committee of Annapurnamma Peta, Rajamahendravaram — nine days of Vinayaka Chavithi celebrations, the committee members, the daily schedule and photographs from past years." />
    <meta name="theme-color" content="#0e1b33" />
    <link rel="canonical" href="https://srishaktiganapathicommittee.netlify.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sri Shakthi Ganapathi Committee" />
    <meta property="og:url" content="https://srishaktiganapathicommittee.netlify.app/" />
    <meta property="og:title" content="Sri Shakthi Ganapathi Committee" />
    <meta property="og:description" content="Vinayaka Chavithi in Annapurnamma Peta, Rajamahendravaram — the nine-day schedule, the committee, and photographs from past years." />
    <meta property="og:image" content="https://srishaktiganapathicommittee.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sri Shakthi Ganapathi Committee, Annapurnamma Peta, Rajamahendravaram" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="te_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sri Shakthi Ganapathi Committee" />
    <meta name="twitter:description" content="Vinayaka Chavithi in Annapurnamma Peta, Rajamahendravaram — the nine-day schedule, the committee, and photographs from past years." />
    <meta name="twitter:image" content="https://srishaktiganapathicommittee.netlify.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
